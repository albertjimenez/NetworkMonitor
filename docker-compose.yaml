services:
  postgres:
    image: postgres:15
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    expose:
      - 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db_replica/schema.sql:/docker-entrypoint-initdb.d/schema.sql


  nats:
    image: nats:2.10
    expose:
      - 6222
      - 8222
    environment:
      NATS_WS_PORT: ${NATS_WS_PORT}

    ports:
      - "${NATS_PORT}:${NATS_PORT}"
      - "${NATS_WS_PORT}:${NATS_WS_PORT}"
    volumes:
      - ./config.conf:/etc/nats/config.conf
    command: ["-js", "-c", "/etc/nats/config.conf"]


  db_replica:
    build: ./db_replica
    init: true

    depends_on:
      - postgres
      - nats
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - NATS_URL=${NATS_HOSTNAME}:${NATS_PORT}

  system_monitor:
    build: ./system_monitor
    init: true

    depends_on:
      - nats
    environment:
      - NATS_URL=${NATS_HOSTNAME}:${NATS_PORT}

  dashboard:
    build:
      context: ./dashboard
      args:
        - VITE_NATS_URL=ws://localhost:${NATS_WS_PORT}
    depends_on:
      - nats
    environment:
      - VITE_NATS_URL=ws://localhost:${NATS_WS_PORT}
    ports:
      - "${DASHBOARD_PORT}:80"
volumes:
  postgres_data:
